<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Prompt', Tahoma, sans-serif;
    background: #0a0e1a;
    color: #fff;
    line-height: 1.6;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
    padding: 15px 40px;
    box-shadow: 0 4px 30px rgba(0, 212, 255, 0.3);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
  }
  .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-svg {
    width: 50px;
    height: 50px;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
  }
  .logo-text {
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #0a0e1a;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.3);
  }
  .logo-text span { color: #fff; }
  .search-box {
    padding: 12px 25px;
    border: 2px solid rgba(0, 212, 255, 0.5);
    border-radius: 30px;
    background: rgba(10, 14, 26, 0.8);
    color: #fff;
    font-size: 1rem;
    width: 300px;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .search-box::placeholder { color: rgba(255,255,255,0.6); }
  .search-box:focus { 
    outline: none; 
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
  }

  /* ===== Hero ===== */
  .hero {
    background: #0a0e1a;
    padding: 100px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-bg-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    opacity: 0.08;
    z-index: 0;
    pointer-events: none;
  }
  .hero-bg-logo svg { width: 100%; height: 100%; }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
    z-index: 0;
  }
  .hero-content { position: relative; z-index: 1; }
  .hero h1 {
    font-size: 3.5rem;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #00d4ff, #7b2cbf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p { 
    font-size: 1.2rem; 
    color: #a0aec0; 
    max-width: 700px; 
    margin: 0 auto;
  }

  /* ===== Filter Tabs ===== */
  .filter-tabs {
    max-width: 1400px;
    margin: 40px auto 20px;
    padding: 0 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tab {
    padding: 12px 28px;
    background: rgba(20, 30, 50, 0.8);
    border: 2px solid rgba(0, 212, 255, 0.3);
    border-radius: 30px;
    color: #a0aec0;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 0.95rem;
    backdrop-filter: blur(10px);
  }
  .tab:hover { 
    border-color: #00d4ff; 
    color: #fff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }
  .tab.active {
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
  }

  /* ===== Car Grid ===== */
  .car-grid {
    max-width: 1400px;
    margin: 30px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 28px;
  }
  .car-card {
    background: linear-gradient(145deg, #0f1729, #1a2332);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.4s;
    cursor: pointer;
    position: relative;
    backdrop-filter: blur(10px);
  }
  .car-card:hover {
    transform: translateY(-10px);
    border-color: #00d4ff;
    box-shadow: 0 20px 50px rgba(0, 212, 255, 0.3);
  }
  
  /* ===== Image Styles ===== */
  .car-image {
    height: 220px;
    background: linear-gradient(135deg, #1a2332 0%, #0f1729 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .car-image.has-image {
    background-size: cover;
    background-position: center;
  }
  .car-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(10, 14, 26, 0.8) 100%);
  }
  .image-placeholder {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
  }
  .image-placeholder-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 15px;
    background: rgba(0, 212, 255, 0.1);
    border: 2px dashed rgba(0, 212, 255, 0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: rgba(0, 212, 255, 0.6);
  }
  .image-placeholder-text {
    color: rgba(0, 212, 255, 0.6);
    font-size: 0.9rem;
    font-weight: 500;
  }
  .car-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    color: #fff;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
    z-index: 2;
    box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
  }
  .image-hint {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    color: rgba(0, 212, 255, 0.5);
    z-index: 3;
    padding: 5px;
    background: rgba(10, 14, 26, 0.7);
    border-radius: 5px;
    margin: 0 10px;
  }
  .car-info { padding: 22px; }
  .car-name {
    font-size: 1.6rem;
    font-weight: bold;
    margin-bottom: 5px;
    color: #fff;
  }
  .car-trim {
    color: #00d4ff;
    font-size: 0.9rem;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .car-desc {
    color: #718096;
    font-size: 0.9rem;
    margin-bottom: 15px;
    min-height: 42px;
  }
  .car-price {
    font-size: 1.8rem;
    font-weight: bold;
    background: linear-gradient(90deg, #00d4ff, #7b2cbf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 15px;
  }
  .car-specs {
    display: flex;
    gap: 15px;
    padding: 15px 0;
    border-top: 1px solid rgba(0, 212, 255, 0.2);
    border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .spec {
    font-size: 0.85rem;
    color: #718096;
  }
  .spec strong {
    display: block;
    color: #00d4ff;
    font-size: 1.05rem;
    margin-bottom: 3px;
  }
  .btn-view {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
  }
  .btn-view:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 25px rgba(0, 212, 255, 0.5);

  /* ===== Modal ===== */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 26, 0.98);
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.3s;
  }
  .modal.active { display: flex; flex-direction: column; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: linear-gradient(135deg, #0f1729, #1a2332);
    border-radius: 12px 12px 0 0;
    border-bottom: 3px solid;
    border-image: linear-gradient(90deg, #00d4ff, #7b2cbf) 1;
  }
  .modal-title { 
    font-size: 1.4rem; 
    font-weight: bold;
    background: linear-gradient(90deg, #00d4ff, #7b2cbf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn {
    padding: 10px 20px;
    background: rgba(0, 212, 255, 0.2);
    color: #fff;
    border: 1px solid #00d4ff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .modal-btn:hover { 
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
  }
  .modal-btn.close { 
    background: rgba(239, 68, 68, 0.2);
    border-color: #ef4444;
  }
  .modal-btn.close:hover { 
    background: linear-gradient(135deg, #ef4444, #dc2626);
  }
  .modal-body {
    flex: 1;
    background: #fff;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ===== Footer ===== */
  footer {
    background: #0a0e1a;
    padding: 30px 20px;
    text-align: center;
    border-top: 1px solid rgba(0, 212, 255, 0.2);
    color: #4a5568;
    font-size: 0.9rem;

    .hero h1 { font-size: 2.2rem; }
    .logo-text { font-size: 1.2rem; }
    .logo-svg { width: 40px; height: 40px; }
    .search-box { width: 100%; }
    .modal-header { flex-direction: column; gap: 12px; }
    .car-grid { grid-template-columns: 1fr; }
    .hero-bg-logo { width: 400px; height: 400px; }
  }
</style>
</head>

  const carGrid = document.getElementById('carGrid');
  const searchInput = document.getElementById('searchInput');
  const filterTabs = document.querySelectorAll('.tab');
  let currentFilter = 'all';
  let currentSearch = '';

  function renderCars() {
    const filtered = cars.filter(car => {
      const matchFilter = currentFilter === 'all' || car.type === currentFilter;
      const matchSearch = car.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                          car.trim.toLowerCase().includes(currentSearch.toLowerCase()) ||
                          car.desc.toLowerCase().includes(currentSearch.toLowerCase());
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
      carGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#718096;padding:60px;font-size:1.2rem;">ไม่พบรถที่ค้นหา 😕</p>';
      return;
    }

    carGrid.innerHTML = filtered.map((car) => {
      const hasImage = car.image && car.image !== '';
      const imageHtml = hasImage 
        ? `<div class="car-image has-image" style="background-image: url('${car.image}')">
             <div class="image-hint">📸 ${car.image}</div>
             <div class="car-badge">${car.typeName}</div>
           </div>`
        : `<div class="car-image">
             <div class="image-placeholder">
               <div class="image-placeholder-icon">🚗</div>
               <div class="image-placeholder-text">รอรูปภาพ</div>
             </div>
             <div class="car-badge">${car.typeName}</div>
           </div>`;

      return `
        <div class="car-card" onclick="openPDF('${car.pdf}', '${car.name} ${car.trim}')">
          ${imageHtml}
          <div class="car-info">
            <div class="car-name">${car.name}</div>
            <div class="car-trim">Trim: ${car.trim}</div>
            <div class="car-desc">${car.desc}</div>
            <div class="car-price">฿${car.price}</div>
            <div class="car-specs">
              <div class="spec"><strong>${car.specs.drive}</strong>ระบบขับเคลื่อน</div>
              <div class="spec"><strong>${car.specs.warranty}</strong>ประกัน</div>
              ${car.specs.battery ? `<div class="spec"><strong>${car.specs.battery}</strong>แบตเตอรี่</div>` : ''}
            </div>
            <button class="btn-view">📄 เปิดโบรชัวร์ PDF</button>
          </div>
        </div>
      `;
    }).join('');
  }

  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderCars();
  });

  filterTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      filterTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderCars();
    });
  });

  const modal = document.getElementById('pdfModal');
  const pdfFrame = document.getElementById('pdfFrame');
  const modalTitle = document.getElementById('modalTitle');
  let currentPdf = '';

  function openPDF(pdfUrl, title) {
    currentPdf = pdfUrl;
    modalTitle.textContent = `โบรชัวร์ ${title}`;
    pdfFrame.src = pdfUrl + '#toolbar=1&navpanes=1&scrollbar=1';
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closePDF() {
    modal.classList.remove('active');
    pdfFrame.src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('closeBtn').addEventListener('click', closePDF);
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = currentPdf;
    a.download = currentPdf.split('/').pop();
    a.click();
  });
  document.getElementById('openNewBtn').addEventListener('click', () => {
    window.open(currentPdf, '_blank');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePDF();
  });

  renderCars();
</script>
